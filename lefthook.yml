# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json

pre-commit:
  jobs:
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: '*.md'
      run: pnpm exec markdownlint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check-all
      run: pnpm run check-all
