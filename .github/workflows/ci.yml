name: CI

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  code-checks:
    name: Code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@ac0f768a94c9e8c62c90dd347bee79d11a9dc8c2 # v2.6.1

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Spellcheck
        run: pnpm run spellcheck

  github-actions-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the parent the changed-paths step diffs against
      - name: Check changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        # a pull request checks out its merge commit, whose first parent is the base branch
        run: |
          if [ "${EVENT_NAME}" != pull_request ] || [ -n "$(git diff --name-only HEAD^1 HEAD -- .github)" ]; then
            echo "github=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run zizmor
        if: ${{ steps.changes.outputs.github == 'true' }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
      - name: Run jactionlint
        # still runs when zizmor fails, so one run reports both
        if: ${{ !cancelled() && steps.changes.outputs.github == 'true' }}
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          online: strict # a lookup it cannot make fails the job instead of being skipped

  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: ${{ always() }}
    needs:
      - code-checks
      - github-actions-audit
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: marcalexiei/github-actions/check-needs@ac0f768a94c9e8c62c90dd347bee79d11a9dc8c2 # v2.6.1
        with:
          needs: ${{ toJSON(needs) }}
